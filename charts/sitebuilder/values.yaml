# Defaults for Sitebuilder: two Next.js zones from one release, the public site and the admin
# (decisions #1, #77). values-production.yaml overrides what differs in production.
#
# One release per namespace: the site image forwards the admin paths to http://admin:3000, fixed
# when the image is built, so the admin's Service is always named `admin` (decisions #78).

image:
  # The zones' images are <registry>/sitebuilder-site and <registry>/sitebuilder-admin, as
  # main.yaml pushes them under the repository owner. A fork changes this.
  registry: ghcr.io/sajanv88
  # Empty means the chart's appVersion, which release.yaml sets to the git tag. When Argo CD
  # syncs the chart straight from the repo (appVersion 0.0.0), set this to sha-<short-sha>.
  tag: ""
  pullPolicy: IfNotPresent

# GHCR packages are private by default. Create a docker-registry Secret with a token that
# has read:packages and name it here, e.g. [{ name: ghcr-pull }].
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Matches the images: uid/gid 1001, no root, no privilege escalation, read-only root filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

containerPort: 3000

# Both Services listen on 3000: the site image's rewrite target is http://admin:3000.
service:
  type: ClusterIP
  port: 3000

# The public site: every path except the admin's.
site:
  replicaCount: 2
  # No CPU limit: throttling a Node server under a burst hurts latency more than sharing a core.
  # The memory limit stays, because Node grows its heap to what it's given.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Merged over `config` below, for this zone only.
  config:
    OTEL_SERVICE_NAME: sitebuilder-site
  env: []

# The admin zone: /admin, /admin-static, /setup and /api/auth. Every process also publishes
# scheduled posts once a minute (decisions #75), so no CronJob is needed.
admin:
  # Must match the host in the site image's ADMIN_ZONE_URL build argument.
  serviceName: admin
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  config:
    OTEL_SERVICE_NAME: sitebuilder-admin
  env: []

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"   # streaming responses
    # nginx.ingress.kubernetes.io/proxy-body-size: "32m"   # uploads up to MEDIA_MAX_BYTES
    # nginx.ingress.kubernetes.io/limit-rps: "20"
  # One host. The admin paths go to the admin Service, everything else to the site.
  host: sitebuilder.example.com
  tls: []
  #  - secretName: sitebuilder-tls
  #    hosts: [sitebuilder.example.com]

# All three probes hit /api/health, which never touches a dependency.
probes:
  startup:
    httpGet: { path: /api/health, port: http }
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet: { path: /api/health, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    httpGet: { path: /api/health, port: http }
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# Non-secret runtime configuration for both zones, rendered into one ConfigMap per zone and
# loaded with envFrom. A change rolls the pods (checksum annotation on each Deployment).
config:
  # The public address, as visitors type it.
  SITE_URL: https://sitebuilder.example.com
  # Uploads: "s3" (S3_ENDPOINT, S3_BUCKET, S3_REGION here, the keys in existingSecret) or
  # "local" with media.local.existingClaim. An admin can also choose in Settings → Media storage.
  MEDIA_STORAGE: s3
  # The header ingress-nginx and Traefik set to the client's address, for the per-IP sign-in
  # limit (decisions #74). The ingress sends the admin paths to the admin directly, so it's
  # the ingress's own value. Without an ingress in front, unset it.
  CLIENT_IP_HEADER: x-real-ip
  # S3_ENDPOINT: https://minio.example.com
  # S3_BUCKET: sitebuilder-media
  # S3_REGION: us-east-1

# Name of a Secret that already exists in the namespace (External Secrets, Sealed Secrets, or
# created by hand) with AUTH_SECRET, and as needed CRON_SECRET, S3_ACCESS_KEY_ID and
# S3_SECRET_ACCESS_KEY. The chart only references it; secret values never go in values files.
existingSecret: ""

# Uploads on a volume instead of S3 (MEDIA_STORAGE: local). The claim must already exist, and be
# ReadWriteMany unless every pod runs on one node: the admin writes to it, the site reads it.
media:
  local:
    existingClaim: ""
    mountPath: /data/media

# .next/cache must be writable with a read-only root filesystem.
nextCache:
  sizeLimit: 512Mi

# Covers in-flight requests and after() callbacks on SIGTERM.
terminationGracePeriodSeconds: 30

revisionHistoryLimit: 3

# Spread replicas across zones and nodes when the cluster can; never block scheduling on it.
topologySpread:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}

db:
  # An existing Secret with a DATABASE_URL key, created outside the chart. Empty means
  # "<release fullname>-db". Both zones and the migrate Job load it with envFrom. It must exist
  # before the first sync, or the migrate pod stays in CreateContainerConfigError.
  #
  # Connections: each pod opens up to 10 for its pool and 2 for the cache handler
  # (decisions #63). Size Postgres or PgBouncer for (site + admin replicas) × 12, plus 1 for
  # the migrate Job.
  externalSecret:
    name: ""

  migrate:
    # Run committed migrations as an Argo CD PreSync Job on every sync, from the admin image,
    # the only one with the migrator (decisions #28). Plain `helm install` ignores the hook, so
    # the Job runs beside the new pods; pages that read the database fail until it's done.
    enabled: true
    command: ["node", "packages/db/dist/migrate.mjs"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
