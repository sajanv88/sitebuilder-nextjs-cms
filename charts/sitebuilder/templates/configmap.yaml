{{- range $zone := list "site" "admin" }}
{{- $ctx := dict "root" $ "zone" $zone }}
{{- $config := include "zone.config" $ctx | fromYaml }}
{{- if and (eq (toString (get $config "MEDIA_STORAGE")) "local") (not $.Values.media.local.existingClaim) }}
{{- fail "config.MEDIA_STORAGE is local, but media.local.existingClaim is empty: uploads need a volume (or use s3)" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zone.fullname" $ctx }}
  labels:
    {{- include "zone.labels" $ctx | nindent 4 }}
data:
  {{- range $key, $value := $config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
