{{- range $zone := list "site" "admin" }}
{{- $ctx := dict "root" $ "zone" $zone }}
{{- $values := index $.Values $zone }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zone.fullname" $ctx }}
  labels:
    {{- include "zone.labels" $ctx | nindent 4 }}
spec:
  {{- if not $values.autoscaling.enabled }}
  replicas: {{ $values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "zone.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      annotations:
        checksum/config: {{ include "zone.config" $ctx | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "zone.labels" $ctx | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ $zone }}
          image: {{ include "zone.image" $ctx | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $.Values.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ $.Values.containerPort | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            {{- with $values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "zone.fullname" $ctx }}
            {{- with $.Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if ne (include "app.dbSecretName" $) $.Values.existingSecret }}
            - secretRef:
                name: {{ include "app.dbSecretName" $ }}
            {{- end }}
          startupProbe:
            {{- toYaml $.Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml $.Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml $.Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/{{ $zone }}/.next/cache
            {{- if $.Values.media.local.existingClaim }}
            # The admin writes uploads; the site only serves them (decisions #55).
            - name: media
              mountPath: {{ $.Values.media.local.mountPath }}
              readOnly: {{ eq $zone "site" }}
            {{- end }}
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: {{ $.Values.nextCache.sizeLimit }}
        {{- with $.Values.media.local.existingClaim }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
      {{- if $.Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "zone.selectorLabels" $ctx | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "zone.selectorLabels" $ctx | nindent 14 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
