{{- range $zone := list "site" "admin" }}
{{- $ctx := dict "root" $ "zone" $zone }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zone.serviceName" $ctx }}
  labels:
    {{- include "zone.labels" $ctx | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "zone.selectorLabels" $ctx | nindent 4 }}
{{- end }}
