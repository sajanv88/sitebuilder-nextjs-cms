{{- if .Values.ingress.enabled -}}
{{- $site := include "zone.serviceName" (dict "root" $ "zone" "site") }}
{{- $admin := include "zone.serviceName" (dict "root" $ "zone" "admin") }}
# One host. The admin zone's paths go straight to it (decisions #79); the site zone would
# forward them too, but this saves a hop and lets the admin see the ingress's client address.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - secretName: {{ .secretName }}
      hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range list "/admin" "/admin-static" "/setup" "/api/auth" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $admin }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $site }}
                port:
                  name: http
{{- end }}
