packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole repo. Packages depend on "catalog:".
# turbo is pinned in the root package.json instead: the Dockerfile reads it from there.
catalog:
  "@biomejs/biome": 2.5.15
  "@nuvui/icons": 0.1.0
  "@nuvui/react": 0.7.0
  "@nuvui/table": 0.1.7
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/api-logs": 0.223.0
  "@opentelemetry/instrumentation": 0.223.0
  "@opentelemetry/resources": 2.12.0
  "@opentelemetry/sdk-logs": 0.223.0
  "@opentelemetry/sdk-metrics": 2.12.0
  "@opentelemetry/sdk-trace-base": 2.12.0
  "@tanstack/react-table": 9.3.1
  "@types/node": 26.6.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vercel/otel": 2.1.3
  next: 16.4.2
  postcss: 8.5.30
  react: 19.3.1
  react-dom: 19.3.1
  sass: 1.105.2
  server-only: 0.0.1
  stylelint: 17.16.0
  stylelint-config-standard-scss: 17.0.0
  typescript: 7.0.2
  valibot: 1.5.0
  "@electric-sql/pglite": 0.4.6
  "@types/pg": 8.23.1
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  esbuild: 0.28.2
  pg: 8.23.1
  vitest: 5.0.5
  # Better Auth. 1.7.12 is younger than minimumReleaseAge; bump them together; the `auth` CLI runs through pnpm dlx at the same version.
  "@better-auth/core": 1.7.11
  "@better-auth/drizzle-adapter": 1.7.11
  "@better-auth/utils": 0.5.0
  better-auth: 1.7.11

# Install scripts are denied unless listed here (strictDepBuilds is on by default).
# Review a package's script before setting it to true.
allowBuilds:
  "@parcel/watcher": false
  esbuild: true

# Supply chain: a version must be a day old before it can be installed, and a package
# whose new version lost the provenance its previous version had is refused.
minimumReleaseAge: 1440
trustPolicy: no-downgrade

audit:
  level: high

permissions:
  drizzle-kit:
    skills: false
  # Ships agent skills too. Not approved: dependencies don't add instructions for Claude.
  "@tanstack/react-table":
    skills: false
